version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: school_admission_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-school_admission}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/SchoolAdmission.Api/Migrations/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-school_admission}"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - admission_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_admission_api
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-school_admission};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_secure_password_123}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      CorsOrigins: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - admission_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school_admission_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - admission_network

volumes:
  postgres_data:
    name: school_admission_postgres_data

networks:
  admission_network:
    name: school_admission_network
    driver: bridge

